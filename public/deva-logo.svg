<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Electric Blue & Cyan Gradients -->
    <linearGradient id="devaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="devaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="devaCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="devaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="100" cy="100" r="92" fill="url(#devaBgGrad)" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Shield Shape of Strength & Protection -->
  <path d="M100 24 C138 24 170 36 170 76 C170 128 128 166 100 178 C72 166 30 128 30 76 C30 36 62 24 100 24 Z" 
        fill="url(#devaShieldGrad)" filter="url(#devaGlow)" opacity="0.95"/>

  <!-- Inner Cyan Shield Layer -->
  <path d="M100 36 C130 36 156 46 156 78 C156 120 122 152 100 162 C78 152 44 120 44 78 C44 46 70 36 100 36 Z" 
        fill="url(#devaCyanGlow)" opacity="0.85"/>

  <!-- Lightning Bolt of Vitality & Power -->
  <polygon points="106,48 84,104 104,104 94,154 126,92 104,92" fill="url(#lightningGrad)" filter="url(#devaGlow)"/>

  <!-- Glow Sparkles -->
  <circle cx="100" cy="46" r="4.5" fill="#38bdf8" />
  <circle cx="80" cy="60" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="120" cy="60" r="3" fill="#ffffff" opacity="0.9" />
</svg>
